name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:protocol
      - run: npm run build:extension
      - run: npm run build:firefox
      - run: npx --yes web-ext@10.8.0 lint --source-dir .data/firefox-extension --warnings-as-errors
      - run: npm pack --dry-run
      - run: docker build -t ubc-mcp:check .
