<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Update your UBC course data</title>
<style>
*{box-sizing:border-box}body{font:15px/1.6 system-ui;margin:0;color:#17324d;background:#f5f7fa}main{max-width:560px;margin:56px auto;padding:0 20px}section{background:white;border:1px solid #dce4ec;border-radius:14px;padding:28px}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#496174}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 8px}button{font:inherit;font-weight:600;min-height:42px;padding:10px 16px;border:1px solid transparent;border-radius:8px;background:#003b65;color:white;cursor:pointer}button.secondary{background:white;border-color:#c7d4df;color:#17324d}button:hover{filter:brightness(.94)}button:focus-visible,select:focus-visible{outline:3px solid #4593ce;outline-offset:2px}h2{font-size:15px;margin:24px 0 6px}select{font:inherit;padding:8px;border:1px solid #b7c8d5;border-radius:8px;background:white;color:inherit}#status{min-height:1.6em;font-weight:600}#status[data-state=success]{color:#22623b}
</style>
<main><section>
<h1>Time to update your UBC course data</h1>
<p id="age">Checking when your data was last updated…</p>
<p>Open View My Courses in Workday. The extension syncs it as soon as the page loads, while you are signed in.</p>
<div class="actions"><button id="open-workday">Open Workday and update</button></div>
<h2>Not now</h2>
<div class="actions"><button class="secondary" data-snooze="24">Remind me tomorrow</button><button class="secondary" data-snooze="72">In 3 days</button><button class="secondary" data-snooze="168">In a week</button></div>
<h2>Reminder settings</h2>
<p><label for="remind-after">Remind me when the data is older than</label> <select id="remind-after"><option value="24">1 day</option><option value="72">3 days</option><option value="168">1 week</option><option value="0">Never (no reminders)</option></select></p>
<p id="status" role="status" aria-live="polite"></p>
</section></main>
<script src="reminder.js" type="module"></script></html>
