name: ubc-mcp
services:
  ubc-connector:
    image: ubc-mcp:0.1.0-alpha.2
    build:
      context: ..
    entrypoint: ["node", "dist/connector/cli.js", "serve"]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    environment:
      UBC_DATA_DIR: /data/connector
      UBC_CONNECTOR_HOST: 0.0.0.0
      UBC_CONNECTOR_PORT: "8792"
    ports: ["127.0.0.1:8792:8792"]
    volumes: ["ubc-data:/data"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8792/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"
          pids: 100
volumes:
  ubc-data:
